<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

  <!-- ================= NAVBAR ================= -->

  <nav class="navbar bg-black">
    <div class="container">
      <span class="navbar-brand mb-0 h1 text-light ms-4">
        Expense Tracker
      </span>
    </div>
  </nav>


  <!-- ================= MAIN ================= -->

  <main>
    
    <div class="container mt-4">
    <div id="alertContainer"></div>

      <!-- ================= SUMMARY CARDS ================= -->

      <div class="row g-3">

        <!-- Total -->
        <div class="col">
          <div class="card">
            <div class="card-body text-center">

              <h5 class="card-title">
                Total
              </h5>

              <p id="totalAmount" class="card-text">
                0.00
              </p>

            </div>
          </div>
        </div>


        <!-- Number of Expenses -->
        <div class="col">
          <div class="card">
            <div class="card-body text-center">

              <h5 class="card-title">
                Number of Expenses
              </h5>

              <p id="expenseCount" class="card-text">
                0
              </p>

            </div>
          </div>
        </div>


        <!-- Highest Expense -->
        <div class="col">
          <div class="card">
            <div class="card-body text-center">

              <h5 class="card-title">
                Highest Expense
              </h5>

              <p id="highestExpense" class="card-text">
                0.00
              </p>

            </div>
          </div>
        </div>

      </div>


      <!-- ================= ADD EXPENSE FORM ================= -->

      <div class="row mt-4">

        <div class="col">

          <div class="border rounded p-3">

            <h5 class="mb-3">
              Add Expense
            </h5>

            <form id="expenseForm">

              <div class="row g-3">

                <!-- Title -->
                <div class="col-md-4">

                  <label for="title" class="form-label">
                    Title
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    placeholder="Lunch"
                     required
                  >

                </div>


                <!-- Amount -->
                <div class="col-md-2">

                  <label for="amount" class="form-label">
                    Amount
                  </label>

                  <input
                    type="number"
                    class="form-control"
                    id="amount"
                    placeholder="4.50"
                    step="0.01"
                    min="0"
                     required
                  >

                </div>


                <!-- Category -->
                <div class="col-md-3">

                  <label for="category" class="form-label">
                    Category
                  </label>

                  <select
                    class="form-select"
                    id="category"
                  >

                    <option selected disabled>
                      Choose...
                    </option>

                    <option value="Food">
                      Food
                    </option>

                    <option value="Transport">
                      Transport
                    </option>

                    <option value="Bills">
                      Bills
                    </option>

                    <option value="Shopping">
                      Shopping
                    </option>

                    <option value="Entertainment">
                      Entertainment
                    </option>

                    <option value="Other">
                      Other
                    </option>

                  </select>

                </div>


                <!-- Date -->
                <div class="col-md-3">

                  <label for="date" class="form-label">
                    Date
                  </label>

                  <input
                    type="date"
                    class="form-control"
                    id="date"
                    min="2000-01-01"
                    max="2026-09-28"
                     required
                  >

                </div>


                <!-- Button -->
                <div class="col-12">

                  <button
                    type="submit"
                    class="btn btn-primary"
                  >
                    Add expense
                  </button>

                </div>

              </div>

            </form>

          </div>

        </div>

      </div>


      <!-- ================= EXPENSES TABLE ================= -->

      <div class="row mt-4">

        <div class="col">

          <div class="border rounded p-3">

            <!-- Table Header + Filter -->

            <div class="d-flex justify-content-between align-items-center mb-3">

              <h5 class="mb-0">
                Expenses
              </h5>


              <!-- Category Filter -->

              <div class="d-flex align-items-center gap-2">

                <label
                  for="filterCategory"
                  class="form-label mb-0"
                >
                  Category
                </label>

                <select
                  class="form-select"
                  id="filterCategory"
                >

                  <option value="all" selected>
                    All
                  </option>

                  <option value="Food">
                    Food
                  </option>

                  <option value="Transport">
                    Transport
                  </option>

                  <option value="Bills">
                    Bills
                  </option>

                  <option value="Shopping">
                    Shopping
                  </option>

                  <option value="Entertainment">
                    Entertainment
                  </option>

                  <option value="Other">
                    Other
                  </option>

                </select>

              </div>

            </div>

            <!-- Spinner -->

            <div id="spinner" class="d-none text-center mb-3">
                <button class="btn btn-primary" type="button" disabled>
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span role="status">Loading...</span>
                </button>
            </div>
            <!-- Responsive Table -->

            <div class="table-responsive">

              <table class="table">

                <thead>

                  <tr>

                    <th scope="col">
                      Title
                    </th>

                    <th scope="col">
                      Amount
                    </th>

                    <th scope="col">
                      Category
                    </th>

                    <th scope="col">
                      Date
                    </th>

                    <th scope="col">
                      Actions
                    </th>

                  </tr>

                </thead>


                <!-- JavaScript will create rows here -->

                <tbody id="expensesTableBody">

                </tbody>

              </table>

            </div>

          </div>

        </div>

      </div>


    </div>

  </main>
  <div
      class="modal fade edit-modal"
      id="edit-modal"
      tabindex="-1"
      aria-labelledby="edit-modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="edit-modal-title">Edit expense</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form id="edit-form" novalidate>
            <div class="modal-body">
              <input type="hidden" id="edit-id" />

              <div class="mb-3">
                <label class="form-label" for="edit-title">Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="edit-title"
                  aria-describedby="edit-title-error"
                  required
                />
                <p
                  class="form-error"
                  id="edit-title-error"
                  aria-live="polite"
                ></p>
              </div>

              <div class="mb-3">
                <label class="form-label" for="edit-amount">Amount</label>
                <input
                  type="number"
                  class="form-control"
                  id="edit-amount"
                  min="0"
                  step="0.01"
                  aria-describedby="edit-amount-error"
                  required
                />
                <p
                  class="form-error"
                  id="edit-amount-error"
                  aria-live="polite"
                ></p>
              </div>

              <div class="mb-3">
                <label class="form-label" for="edit-category">Category</label>
                <select
                  class="form-select"
                  id="edit-category"
                  aria-describedby="edit-category-error"
                  required
                >
                  <option value="" disabled>Choose...</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <p
                  class="form-error"
                  id="edit-category-error"
                  aria-live="polite"
                ></p>
              </div>

              <div class="mb-0">
                <label class="form-label" for="edit-date">Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="edit-date"
                  aria-describedby="edit-date-error"
                  required
                />
                <p
                  class="form-error"
                  id="edit-date-error"
                  aria-live="polite"
                ></p>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="save-changes-btn"
              >
                <span
                  class="spinner-border spinner-border-sm d-none"
                  id="save-changes-spinner"
                  role="status"
                  aria-hidden="true"
                ></span>
                <span id="save-changes-btn-label">Save changes</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
